<!doctype html>
<!-- lobot workbench: shelf, sentence, experiment tree, word inspector. Follows DESIGN.md ("the fork"). -->
<!-- gstack-lint-disable hero-balance: the experiment tree and the sentence fill the first screen; the answers are the content, so there is no headline band -->
<!-- gstack-lint-disable hand-drawn-svg: the tree curves are data, each one links the shared answer words to one run -->
<!-- gstack-lint-disable monospace-costume: neuron ids, doses and token indices are values a user might copy; they are set in mono -->
<!-- gstack-lint-disable screen-word-budget: most words on the screen are model answers in the experiment tree, which are the content -->
<!-- gstack-lint-disable section-gap: the sentence, the experiment tree and the knob row form one screen, not marketing sections -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lobot workbench</title>
<meta name="description" content="A local workbench that pushes neurons in a small open model and shows where each run's answer forks from the baseline.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23131C18'/%3E%3Cpath d='M6 16 C 14 16, 14 7, 26 7' stroke='%23DCE7DF' stroke-width='2.5' fill='none'/%3E%3Cpath d='M6 16 C 14 16, 14 25, 26 25' stroke='%23FF5FA4' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Tokens: DESIGN.md is the source of truth. Dark is the default. */
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #131C18; --sheet: #1C2722; --grid: #24332C;
  --ink: #DCE7DF; --ink-muted: #9DB0A6;
  --primary: #B0404F; --primary-hover: #9A3240; --on-primary: #FBF1EF;
  --cut: #FF5FA4; --on-cut: #131C18;
  --ok: #8FD3A8; --ok-tint: #1D3328; --warn: #F0C46A; --warn-tint: #3A2F17; --error: #FF8A80; --error-tint: #3A1E1C;
  --display: "Bricolage Grotesque", "Arial Narrow", sans-serif;
  --body: "Atkinson Hyperlegible Next", "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --shelf: 300px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --ground: #D5E3D0; --sheet: #EEF4EB; --grid: #B7CCB2;
  --ink: #1E2924; --ink-muted: #41504A;
  --primary: #7B1D2B; --primary-hover: #651522; --on-primary: #FBF1EF;
  --cut: #FF4F9A; --on-cut: #1E2924;
  --ok: #2F6B4A; --ok-tint: #D3E6D8; --warn: #8A5A00; --warn-tint: #F3E6C4; --error: #B3261E; --error-tint: #F6DAD7;
}
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body {
  margin: 0; min-height: 100dvh; background-color: var(--ground); color: var(--ink); font: 400 16px/1.5 var(--body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; background-position: -1px -1px;
}
[hidden] { display: none !important; }
button, input, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-feature-settings: "tnum"; }
.meta { font: 13px var(--mono); color: var(--ink-muted); font-feature-settings: "tnum"; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.skip { position: absolute; left: 16px; top: -64px; background: var(--ink); color: var(--ground); padding: 8px 16px; z-index: 20; }
.skip:focus { top: 16px; }

.btn { font: 700 14px/1.25 var(--body); color: var(--ink); background: transparent; border: 2px solid var(--ink); border-radius: 0; padding: 8px 12px; min-height: 44px; cursor: pointer; }
.btn:hover:not([disabled]) { background: var(--ink); color: var(--ground); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn:active:not([disabled]) { transform: translateY(1px); }
.btn-sm { min-height: 44px; padding: 4px 12px; font-size: 13px; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-size: 16px; display: inline-flex; gap: 12px; align-items: center; }
.btn-primary:hover:not([disabled]) { background: var(--primary-hover); border-color: var(--primary-hover); color: var(--on-primary); }
.btn-primary kbd, .btn-stop kbd { font: 400 12px var(--mono); opacity: .85; }
.btn-stop { display: inline-flex; gap: 12px; align-items: center; }
.link { all: unset; cursor: pointer; text-decoration: underline 2px; text-underline-offset: 6px; }
.link:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.state { display: inline-flex; gap: 8px; align-items: baseline; padding: 2px 8px; font: 700 11px var(--mono); white-space: nowrap; }
.state.ok { background: var(--ok-tint); color: var(--ok); } .state.warn { background: var(--warn-tint); color: var(--warn); } .state.info { background: var(--sheet); color: var(--ink-muted); } .state.err { background: var(--error-tint); color: var(--error); }
.field { width: 100%; font: 400 18px/1.45 var(--body); color: var(--ink); background: transparent; border: 0; border-bottom: 2px solid var(--ink); border-radius: 0; padding: 8px 0; resize: vertical; }
.num { font: 500 16px var(--mono); font-feature-settings: "tnum"; color: var(--ink); background: transparent; border: 0; border-bottom: 2px solid var(--ink); border-radius: 0; padding: 4px 2px; width: 100%; min-height: 40px; }
.num[aria-invalid="true"] { border-bottom-color: var(--error); color: var(--error); }
.label { display: block; font: 700 14px var(--body); margin: 0 0 4px; }

/* Shell: collapsible shelf + main */
.shell { display: grid; grid-template-columns: var(--shelf) minmax(0, 1fr); min-height: 100dvh; }
.shell.collapsed { --shelf: 56px; }
.shelf { border-right: 2px solid var(--ink); background: var(--sheet); padding: 20px; position: sticky; top: 0; height: 100dvh; overflow-y: auto; }
.shelf .head { display: flex; justify-content: space-between; align-items: center; }
.wordmark { font: 800 32px/1 var(--display); font-stretch: 75%; letter-spacing: -0.02em; margin: 0; }
.shelf h2 { text-wrap: balance; font: 700 14px var(--body); margin: 24px 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.model { all: unset; box-sizing: border-box; cursor: pointer; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; width: 100%; padding: 8px; min-height: 44px; }
.model b { font: 800 20px var(--display); font-stretch: 75%; }
.model[aria-current="true"] { background: var(--ink); color: var(--ground); }
.model[aria-current="true"] .meta { color: var(--ground); }
.model:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.model[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.exp { all: unset; box-sizing: border-box; cursor: pointer; display: block; width: 100%; padding: 8px; min-height: 44px; border-top: 1px solid var(--grid); }
.exp:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.exp[aria-current="true"] { outline: 2px solid var(--ink); outline-offset: -2px; }
.exp .p { display: block; font: 400 14px/1.35 var(--body); }
.empty { border: 2px dashed var(--ink-muted); padding: 12px; color: var(--ink-muted); font-size: 14px; margin: 0; }
.shell.collapsed .shelf { padding: 16px 0; overflow: hidden; }
.shell.collapsed .shelf .full { display: none; }
.rail { display: none; flex-direction: column; align-items: center; gap: 16px; }
.shell.collapsed .rail { display: flex; }
.rail .vt { writing-mode: vertical-rl; transform: rotate(180deg); }
@media (max-width: 860px) {
  .shell, .shell.collapsed { grid-template-columns: 1fr; }
  .shelf { position: static; height: auto; border-right: 0; border-bottom: 2px solid var(--ink); }
  .shell.collapsed .shelf { padding: 12px 16px; }
  .shell.collapsed .rail { flex-direction: row; justify-content: space-between; }
  .shell.collapsed .rail .vt { writing-mode: horizontal-tb; transform: none; }
}

.main { padding: 20px 40px 32px; min-width: 0; width: 100%; max-width: 1400px; justify-self: center; }
@media (max-width: 720px) { .main { padding: 16px; } }

/* The sentence: model and edits read as one instruction; the prompt sits under it. */
.ask { padding-bottom: 16px; border-bottom: 1px solid var(--ink-muted); }
.sentence { font: 400 24px/1.6 var(--body); margin: 0; }
.sentence .edit { white-space: nowrap; }
.sentence .dose { font: 800 28px var(--display); font-stretch: 75%; }
.sentence .edit[aria-current="true"] .link { text-decoration-thickness: 4px; }
.sentence .x { all: unset; cursor: pointer; font: 14px var(--mono); color: var(--ink-muted); padding: 0 4px; }
.sentence .x:focus-visible { outline: 3px solid var(--ink); }
@media (max-width: 720px) { .sentence { font-size: 20px; } .sentence .edit { white-space: normal; } .sentence .dose { font-size: 22px; } }
.row2 { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.pop { position: absolute; z-index: 10; background: var(--sheet); border: 2px solid var(--ink); min-width: 300px; padding: 16px; }
.pop .opt { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 12px; width: calc(100% + 32px); margin: 0 -16px; padding: 12px 16px; border-top: 1px solid var(--grid); }
.pop .opt:first-child { border-top: 0; margin-top: -16px; }
.pop .opt:last-child { margin-bottom: -16px; }
.pop .opt:hover, .pop .opt:focus-visible { background: var(--ink); color: var(--ground); outline: none; }
.pop .opt[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.pop .opt b { font: 800 20px var(--display); font-stretch: 75%; }
.pop .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.pop .err { color: var(--error); font-size: 14px; margin: 8px 0 0; min-height: 0; }

/* The experiment tree */
.work { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; }
.work.inspecting { grid-template-columns: minmax(0, 1fr) 400px; }
@media (max-width: 1100px) { .work.inspecting { grid-template-columns: 1fr; } }
.tree { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 96px; padding: 32px 0 16px; min-height: max(320px, calc(100dvh - 520px)); align-content: center; }
.tree svg.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.links path.draw { stroke-dasharray: 2000; animation: draw 420ms cubic-bezier(.65,0,.35,1) both; }
@keyframes draw { from { stroke-dashoffset: 2000; } to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .links path.draw { animation: none; stroke-dasharray: none; } }
.root { align-self: center; font: 400 clamp(32px, 4vw, 44px)/1.2 var(--body); position: relative; max-width: 14ch; }
.root .flag { position: absolute; left: 0; top: calc(100% + 8px); }
.flag { font: 600 12px var(--mono); background: var(--cut); color: var(--on-cut); padding: 0 4px; white-space: nowrap; }
.runs { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.run { position: relative; padding-left: 12px; min-width: 0; }
.run .k { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; min-width: 0; }
.run .pick { all: unset; cursor: pointer; font: 13px/24px var(--mono); min-height: 24px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; min-width: 0; }
.run .pick:focus-visible { outline: 3px solid var(--ink); }
.run[aria-current="true"] .pick { color: var(--ink); }
.run .t { font: 400 20px/1.5 var(--body); overflow-wrap: anywhere; }
.run[aria-current="true"] .t { font-size: 24px; }
.run .w { cursor: pointer; }
.run .w:hover { text-decoration: underline 1px var(--ink-muted); text-underline-offset: 4px; }
.run .w.inspected { outline: 2px solid var(--ink); outline-offset: 2px; }
.run .w.split { font-weight: 700; text-decoration: underline 2px var(--ink-muted); text-underline-offset: 4px; }
.run[aria-current="true"] .w.split { background: var(--cut); color: var(--on-cut); text-decoration: none; }
.run .more { all: unset; cursor: pointer; font: 13px var(--mono); color: var(--ink-muted); text-decoration: underline; margin-left: 8px; }
.run .more:focus-visible { outline: 3px solid var(--ink); }
.redact { display: inline-block; height: .8em; background: var(--ink-muted); opacity: .25; margin-right: .3em; vertical-align: -.05em; }
.run.generating .redact { animation: pulse 1.2s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: .15; } to { opacity: .4; } }
@media (prefers-reduced-motion: reduce) { .run.generating .redact { animation: none; } }
.tree-empty { grid-column: 1 / -1; }
@media (max-width: 860px) { .tree { grid-template-columns: minmax(0, 1fr); row-gap: 28px; } .runs { padding-left: 40px; } }

/* Word inspector */
.inspector { background: var(--sheet); border: 2px solid var(--ink); padding: 16px; align-self: start; position: sticky; top: 16px; }
.inspector h3 { font: 800 28px/1 var(--display); font-stretch: 75%; margin: 0; overflow-wrap: anywhere; }
.inspector .kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin-top: 12px; font-size: 14px; }

/* Control row */
.control { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding: 12px 0; border-top: 1px solid var(--ink-muted); }
.knob svg { width: 150px; height: 150px; touch-action: none; cursor: grab; display: block; }
.knob svg:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
.bigdose { all: unset; cursor: text; display: block; font: 800 clamp(56px, 7vw, 96px)/.85 var(--display); font-stretch: 75%; letter-spacing: -0.02em; font-feature-settings: "tnum"; }
.bigdose:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
.doseIn { font: 800 clamp(48px, 6vw, 80px)/.9 var(--display); font-stretch: 75%; width: 5ch; background: transparent; color: var(--ink); border: 0; border-bottom: 2px solid var(--ink); }
.control .spacer { flex: 1; }
.status { max-width: 52ch; }

/* Share card */
.page h1 { font: 800 40px/1 var(--display); font-stretch: 75%; margin: 8px 0 0; }
.page .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.card { width: min(100%, 600px); aspect-ratio: 4 / 5; border: 2px solid var(--ink); padding: 28px; display: flex; flex-direction: column; background: var(--ground);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 12px 12px; }
.card .ct { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.card .cf { flex: 1; position: relative; display: grid; grid-template-columns: auto 1fr; column-gap: 72px; align-items: center; }
.card .cf svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.card .cb { display: flex; flex-direction: column; gap: 88px; font: 400 21px/1.3 var(--body); }
.card .tok { background: var(--cut); color: var(--on-cut); font-weight: 700; }
.copyrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--grid); }
.copyrow .v { overflow-wrap: anywhere; white-space: pre-wrap; }

/* Behaviors on the shelf */
.beh { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; border-top: 1px solid var(--grid); }
.beh .open { all: unset; box-sizing: border-box; cursor: pointer; display: block; padding: 8px; min-height: 44px; min-width: 0; }
.beh .open:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
.beh .open b { font: 800 20px var(--display); font-stretch: 75%; margin-right: 8px; }
.beh.dim .open b { opacity: .55; }
.beh[aria-current="true"] .open { outline: 2px solid var(--ink); outline-offset: -2px; }

/* Research mode banner (design decision 6A) */
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--warn-tint); color: var(--warn); padding: 8px 12px; margin: 0 0 12px; font: 700 12px var(--mono); }
.banner .btn { color: var(--warn); border-color: var(--warn); }
.banner .btn:hover:not([disabled]) { background: var(--warn); color: var(--warn-tint); }

/* Pages that replace the workbench: New behavior, Create progress, behavior evidence */
.page .lead { max-width: 62ch; margin: 8px 0 0; }
.ruled { list-style: none; margin: 24px 0 0; padding: 0; border-bottom: 1px solid var(--grid); max-width: 900px; }
.ruled > li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; padding: 16px 0; border-top: 1px solid var(--grid); }
.ruled > li b.name { font: 800 28px/1 var(--display); font-stretch: 75%; }
.ruled > li.off b.name { opacity: .5; }
.stages > li { grid-template-columns: 40px minmax(0, 1fr) auto; }
.stages > li .no { font: 800 28px/1 var(--display); font-stretch: 75%; color: var(--ink-muted); }
.stages > li[aria-current="step"] .no, .stages > li.done .no { color: var(--ink); }
.stages > li.wait { color: var(--ink-muted); }
.stroke { width: 48px; height: 12px; display: block; }
.ev { width: 100%; max-width: 1000px; border-collapse: collapse; margin-top: 16px; font-size: 14px; }
.ev th { text-align: left; font: 700 13px var(--body); padding: 8px 12px 8px 0; border-bottom: 2px solid var(--ink); }
.ev td { padding: 12px 12px 12px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
.ev td.verb { font: 800 22px/1 var(--display); font-stretch: 75%; white-space: nowrap; }
.ev td.verb .stroke { display: inline-block; vertical-align: middle; margin-right: 12px; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }
.evwrap { overflow-x: auto; }
.kv2 { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 24px; margin-top: 16px; max-width: 900px; font-size: 14px; }
.kv2 > :nth-child(odd) { color: var(--ink-muted); }
.kv2 > :nth-child(even) { overflow-wrap: anywhere; }

/* Confirm dialog */
dialog { background: var(--sheet); color: var(--ink); border: 2px solid var(--ink); border-radius: 0; padding: 24px; max-width: min(520px, calc(100vw - 32px)); }
dialog::backdrop { background: rgb(0 0 0 / .55); }
dialog h2 { font: 800 28px/1 var(--display); font-stretch: 75%; margin: 0 0 12px; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell" id="shell">
  <aside class="shelf" id="shelf" aria-label="Models and experiments">
    <div class="rail"><button class="btn btn-sm" id="expand" type="button" aria-label="Open the shelf" aria-controls="shelf">▸</button><span class="meta vt" id="railText"></span></div>
    <div class="full">
      <p class="banner" data-research hidden>RESEARCH MODE · GUARD OFF</p>
      <div class="head"><span class="wordmark">lobot</span><button class="btn btn-sm" id="collapse" type="button" aria-label="Collapse the shelf">◂</button></div>
      <h2>Models</h2>
      <div id="models"></div>
      <h2>Behaviors <button class="btn btn-sm" id="newBeh" type="button">+ New</button></h2>
      <div id="behaviors"></div>
      <h2>Experiments <span class="meta" id="expCount"></span></h2>
      <div id="exps"></div>
      <h2>Theme <button class="btn btn-sm" id="themeBtn" type="button">Light</button></h2>
    </div>
  </aside>

  <main class="main" id="main">
    <section id="vWork" aria-label="Workbench">
      <div class="ask" id="ask">
        <p class="banner" data-research hidden>RESEARCH MODE: the guard is off, and every run records it. <button class="btn btn-sm" type="button" data-guard-on>Turn the guard back on</button></p>
        <h1 class="sentence" id="sentence"></h1>
        <label class="label" for="prompt" style="margin-top:12px">Prompt</label>
        <textarea id="prompt" class="field" rows="2" spellcheck="true"></textarea>
        <div class="row2">
          <button class="btn btn-primary" id="runBtn" type="button">Run <kbd class="kbd">⌘ Enter</kbd></button>
          <button class="btn btn-stop" id="stopBtn" type="button" hidden>Stop <kbd>Esc</kbd></button>
          <button class="btn" type="button" id="fanBtn" hidden>Run at 5 doses</button>
          <span class="state info" id="guardKey"></span>
          <button class="link meta" type="button" id="researchBtn">Research mode…</button>
          <button class="btn" type="button" id="shareBtn" disabled>Share card</button>
          <span class="meta" id="plan"></span>
        </div>
      </div>
      <div class="work" id="work">
        <div>
          <div class="tree" id="tree"><svg class="links" id="links" aria-hidden="true"></svg><div class="root" id="root"></div><div class="runs" id="runs"></div></div>
          <div class="control">
            <div class="knob" id="knob"></div>
            <div><button class="bigdose" id="bigdose" type="button" aria-label="Type a dose"></button><input class="doseIn" id="doseIn" type="text" inputmode="decimal" spellcheck="false" aria-label="Dose" hidden><span class="meta" id="knobFor"></span></div>
            <span class="spacer"></span>
            <div class="status" role="status"><span class="state info" id="runState"></span><div class="meta" id="runMsg" style="margin-top:6px"></div></div>
          </div>
        </div>
        <aside class="inspector" id="inspector" hidden aria-labelledby="iHead"></aside>
      </div>
    </section>

    <section id="vShare" class="page" hidden aria-labelledby="shareH">
      <div class="top"><h1 id="shareH">Share card</h1><button class="btn" type="button" id="backBtn">Back to the tree</button></div>
      <div style="display:flex;gap:32px;flex-wrap:wrap;margin-top:20px">
        <div class="card" id="card"></div>
        <div style="flex:1;min-width:280px;max-width:60ch">
          <div class="copyrow"><div><span class="label">Post for X</span><p class="meta v" id="post" style="color:var(--ink);margin:0"></p><span class="meta" id="postCount"></span></div><button class="btn btn-sm" type="button" data-copy="post">Copy for X</button></div>
          <div class="copyrow"><div><span class="label">Recipe</span><p class="meta v" id="recipe" style="margin:0"></p></div><button class="btn btn-sm" type="button" data-copy="recipe">Copy</button></div>
          <p class="meta">The card uses only recorded text from this experiment. Nothing is posted anywhere: you copy and post by hand.</p>
        </div>
      </div>
    </section>

    <section id="vPage" class="page" hidden aria-labelledby="pageH"></section>
  </main>
</div>
<dialog id="dlg" aria-labelledby="dlgH"><form method="dialog"><h2 id="dlgH"></h2><p id="dlgP" style="max-width:52ch"></p>
  <div class="row2"><button class="btn" value="ok" id="dlgOk"></button><button class="btn" value="cancel" autofocus>Cancel</button></div></form></dialog>
<div class="sr" id="live" aria-live="polite"></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const root = document.documentElement;
const store = {
  get(k, d) { try { const v = localStorage.getItem("lobot." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("lobot." + k, JSON.stringify(v)); } catch { /* storage blocked or full: the tree then lives for this page only */ } },

const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const fd = (d) => (d > 0 ? "+" : d < 0 ? "−" : "±") + Math.abs(d).toFixed(2);
// Accepts "+1.5", "-1,5", "−1.50": the typographic minus and a decimal comma both parse.
const parseDose = (s) => { const t = String(s).trim().replace("−", "-").replace(",", "."); return /^[+-]?\d*\.?\d+$/.test(t) ? parseFloat(t) : NaN; };
const at = (sp) => (sp.token != null ? `token ${sp.token}` : "this word");
const nid = (r) => `L${r.layer}N${r.neuron}`;
// An edit is a neuron row {layer, neuron, dose} or a behavior {trait, dose}. A run uses neurons or one behavior.
const isB = (r) => r.trait != null;
const eid = (r) => (isB(r) ? r.trait : nid(r));
const editsText = (rows) => (rows.length ? rows.map((x) => `${eid(x)} ${fd(x.dose)}`).join(", ") : "no edit");
const getJSON = async (url) => { const r = await fetch(url); if (!r.ok) throw Object.assign(new Error(`HTTP ${r.status}`), { status: r.status }); return r.json(); };
const postJSON = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (!/Mac|iPhone|iPad/.test(navigator.platform)) document.querySelectorAll(".kbd").forEach((k) => (k.textContent = "Ctrl Enter"));

/* ---------- theme, shelf ---------- */
root.dataset.theme = store.get("theme2", "dark");
const syncTheme = () => ($("themeBtn").textContent = root.dataset.theme === "dark" ? "Light" : "Dark");
$("themeBtn").addEventListener("click", () => { root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark"; store.set("theme2", root.dataset.theme); syncTheme(); layout(); });
syncTheme();
function setShelf(open) {
  $("shell").classList.toggle("collapsed", !open); store.set("shelf", open);
  (open ? $("collapse") : $("expand")).focus({ preventScroll: true });
  requestAnimationFrame(layout);
}
$("collapse").addEventListener("click", () => setShelf(false));
$("expand").addEventListener("click", () => setShelf(true));
if (store.get("shelf", true) === false) $("shell").classList.add("collapsed");

/* ---------- state ---------- */
const S = {
  api: false, state: null, running: false, view: "work", inspect: null, focusEdit: 0, sel: null,
  limits: { layers: 32, neurons: 9216, dose_min: -3, dose_max: 3, max_rows: 4 },
  model: null, rows: [], example: false,
  // Guard: on unless research mode (session only, confirmed in a dialog). guardSeen: last guard result per setup.
  guard: true, research: false, guardSeen: {}, checking: false,
  jobs: [], traits: null, families: null, live: null, page: null,
};
// Experiments: one per (model, prompt). Run 1 is the baseline; every steered result adds a run.
const expKey = (model, prompt) => `${model}\n${prompt.trim()}`;
let EXPS = store.get("exps", {});
const saveExps = () => store.set("exps", EXPS);
const curExp = () => EXPS[expKey(S.model, $("prompt").value)] || null;
const rowsKey = (rows) => rows.filter((r) => r.dose !== 0).map((r) => `${eid(r)}@${r.dose}`).sort().join(" ");

function addResult(res, soft = false) {
  const k = expKey(res.model_id, res.prompt);
  let e = EXPS[k];
  if (e && e.baseline.text !== res.baseline.text && !soft) {
    // Greedy decoding with a fixed seed gives the same baseline; if it changed, the settings changed. Start over.
    $("runMsg").textContent = "The baseline differs from this experiment's run 1, so a new experiment starts.";
    e = null;
  }
  if (!e) e = EXPS[k] = { model: res.model_id, prompt: res.prompt, baseline: res.baseline, runs: [], at: Date.now() };
  const key = rowsKey(res.rows);
  const prev = e.runs.findIndex((r) => rowsKey(r.rows) === key);
  const run = { n: prev >= 0 ? e.runs[prev].n : e.runs.length + 2, rows: res.rows, text: res.steered.text, tokens: res.steered.tokens,
    split: res.split && { token: res.split.token, char: res.split.steered_char, base_char: res.split.base_char },
    seconds: res.seconds, recipe: res.recipe, post: res.post, research: !!res.research, at: Date.now() };
  if (prev >= 0) e.runs[prev] = run; else e.runs.push(run);

  return run.n;
}

/* ---------- shelf ---------- */
function renderShelf() {
  const models = S.state ? S.state.models : [{ id: S.model || "Qwen/Qwen3.5-4B", short: (S.model || "Qwen3.5-4B").split("/").pop() }];
  $("models").innerHTML = models.map((m) => {
    const cur = m.id === S.model, st = !S.api ? "server offline" : S.state.replay ? "replay" : cur ? (S.state.no_model ? "no weights" : S.state.warm ? "warm" : "loads on run") : m.gated ? "gated" : "on disk";
    return `<button class="model" type="button" data-model="${esc(m.id)}" title="Switching reloads weights." aria-current="${cur}" ${!S.api || S.running ? 'aria-disabled="true"' : ""}><b>${esc(m.id.split("/").pop())}</b><span class="meta">${st}</span></button>`;
  }).join("");
  const list = Object.values(EXPS).filter((e) => e.model === S.model).sort((a, b) => b.at - a.at);
  $("expCount").textContent = list.length ? String(list.length) : "";
  $("exps").innerHTML = list.length ? list.map((e) => `<button class="exp" type="button" data-prompt="${esc(e.prompt)}" aria-current="${e.prompt === $("prompt").value.trim()}"><span class="p">${esc(e.prompt.length > 70 ? e.prompt.slice(0, 69) + "…" : e.prompt)}</span><span class="meta">${e.runs.length + 1} runs</span></button>`).join("")
    : `<p class="empty">No experiments for this model yet. Type a prompt and press Run.</p>`;
  $("railText").textContent = `${(S.model || "").split("/").pop()} · ${S.rows.length} edit${S.rows.length === 1 ? "" : "s"}`;
  renderBehaviors();
}

/* ---------- behaviors: saved traits (evidence API, else finished Create jobs) and running Creates ---------- */
const STAGES = [["extract", "Contrast prompts and capture"], ["tune", "Tune layer and dose"], ["read_gate", "Read check"], ["final", "Final check"], ["baseline", "Prompt baseline"], ["verdict", "Report card"]];
const active = (j) => j.status === "queued" || j.status === "running";
function behaviors() {
  const mine = S.jobs.filter((j) => j.model_id === S.model);
  const ver = {}, out = [];
  if (S.traits) for (const t of S.traits) out.push({ id: t.id, name: t.family, version: t.version, verdict: t.verdict, guard: t.guard || {}, cards: t.cards || {}, dose: t.dose, layer: t.layer, patch: t.patch, created: t.created });
  else for (const j of mine.filter((j) => j.status === "done").sort((a, b) => a.created - b.created)) {
    ver[j.trait] = (ver[j.trait] || 0) + 1;
    out.push({ id: j.id, name: j.trait, version: ver[j.trait], verdict: j.verdict, guard: j.guard || {}, cards: {}, dose: j.frozen?.dose, layer: j.frozen?.layer, patch: null, created: j.created });
  }
  // Only the newest version of each family is offered in the sentence; older ones stay on the evidence page.
  const newest = {};
  for (const b of out) if (!newest[b.name] || b.version > newest[b.name].version) newest[b.name] = b;
  for (const b of out) {
    b.newest = newest[b.name] === b;
    [b.kind, b.key, b.usable] = b.verdict === "blocked" || b.guard.blocked ? ["err", "GUARD", false]
      : b.verdict !== "knob" ? ["warn", "NO KNOB", false]
      : b.cards.update_down && !b.cards.update_down.passed ? ["warn", "DECREASE FAIL", true] : ["ok", "PASS", true];
  }
  return { saved: out.filter((b) => b.newest).sort((a, b) => b.created - a.created), all: out, running: mine.filter(active) };
}
function renderBehaviors() {
  const B = behaviors(), cur = S.page && S.page.id;
  const run = B.running.map((j) => { const i = STAGES.findIndex(([k]) => k === j.stage) + 1;
    return `<div class="beh"><button class="open" type="button" data-job="${esc(j.id)}" aria-current="${cur === j.id}"><b>${esc(j.trait)}</b><span class="state info">${j.status === "queued" ? "QUEUED" : `CREATING ${i}/6`}</span></button><span></span></div>`; });
  const saved = B.saved.map((b) => `<div class="beh${b.usable ? "" : " dim"}"><button class="open" type="button" data-beh="${esc(b.id)}" aria-current="${cur === b.id}" aria-label="Evidence for ${esc(b.name)} v${b.version}"><b>${esc(b.name)}</b><span class="meta">v${b.version}</span> <span class="state ${b.kind}">${b.key}</span></button>
    <button class="btn btn-sm" type="button" data-use="${esc(b.id)}" ${!b.usable || S.running || S.rows.some((r) => r.trait === b.name) ? "disabled" : ""} aria-label="Use ${esc(b.name)} in the sentence">Use</button></div>`);
  const noCreate = S.state?.replay ? "Replay mode loads no weights, so Create is off." : S.state?.no_model ? "The server runs without weights, so Create is off." : "";
  $("behaviors").innerHTML = run.join("") + saved.join("") || (!S.api ? `<p class="empty">Behaviors load from the server.</p>`
    : `<p class="empty">No validated behavior for this model yet. ${noCreate || `<button class="link" type="button" data-new>Create one from a family</button>.`}</p>`);
  $("newBeh").disabled = !S.api || !!S.state?.replay || !!S.state?.no_model;
}
function useBehavior(id) {
  const b = behaviors().all.find((x) => x.id === id); if (!b || !b.usable) return;
  // A run uses neurons or one behavior: using a behavior replaces the edits, at its frozen dose.
  S.rows = [{ trait: b.name, dose: b.dose ?? 1 }]; S.focusEdit = 0; setView("work"); update();
  setStatus("info", "READY", `${b.name} is in the sentence at its tested dose ${fd(b.dose ?? 1)}. Press Run, or Run at 5 doses.`);
}
$("behaviors").addEventListener("click", (e) => {
  const t = e.target;
  if (t.closest("[data-use]")) useBehavior(t.closest("[data-use]").dataset.use);
  else if (t.closest("[data-beh]")) openPage({ kind: "behavior", id: t.closest("[data-beh]").dataset.beh });
  else if (t.closest("[data-job]")) openPage({ kind: "create", id: t.closest("[data-job]").dataset.job });
  else if (t.closest("[data-new]")) openPage({ kind: "new" });
});
$("newBeh").addEventListener("click", () => openPage({ kind: "new" }));
$("models").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-model]"); if (!b || b.getAttribute("aria-disabled") === "true" || b.dataset.model === S.model) return;
  b.querySelector(".meta").textContent = "switching";
  try {
    const r = await fetch("api/model", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model_id: b.dataset.model }) });
    const body = await r.json();
    if (!r.ok) throw new Error(body.detail || `HTTP ${r.status}`);
    applyState(body); await loadBehaviors();
    S.rows = body.preset_rows.map((x) => ({ ...x })); S.focusEdit = 0;
    setStatus("info", "SWITCHED", "Switching reloads weights. The next run loads them.");
    update();
  } catch (err) { setStatus("err", "ERROR", String(err.message || err)); renderShelf(); }
});
$("exps").addEventListener("click", (e) => { const b = e.target.closest("[data-prompt]"); if (!b || S.running) return; $("prompt").value = b.dataset.prompt; S.sel = null; update(); });

/* ---------- sentence ---------- */
function renderSentence() {
  const edits = S.rows.map((r, i) => `<span class="edit" aria-current="${i === S.focusEdit}">${i ? (i === S.rows.length - 1 ? " and " : ", ") : ""}<button class="link${isB(r) ? "" : " mono"}" type="button" data-focus="${i}" style="font-size:20px" aria-label="Select ${esc(eid(r))} for the knob${isB(r) ? "" : "; press again to edit"}">${esc(eid(r))}</button> at <span class="dose">${fd(r.dose)}</span><button class="x" type="button" data-remove="${i}" aria-label="Remove ${esc(eid(r))}" ${S.running ? "disabled" : ""}>×</button></span>`).join("");
  const full = S.rows.length >= S.limits.max_rows || S.rows.some(isB);
  $("sentence").innerHTML = `On <span class="mono" style="font-size:20px">${esc((S.model || "").split("/").pop())}</span>,
    ${S.rows.length ? `push ${edits}` : "with no edit"} <button class="btn btn-sm" type="button" id="addBtn" ${full || S.running ? "disabled" : ""} ${full ? 'title="A run uses up to 4 neurons, or one behavior."' : ""}>+ edit</button> and ask:`;
}
// "+ edit": push a neuron, or use a saved behavior. A run uses neurons or one behavior, not both.
function addMenu(anchor) {
  const B = behaviors().saved, hasN = S.rows.length > 0;
  const beh = B.map((b) => { const why = !b.usable ? b.key.toLowerCase() : hasN ? "remove the neurons first" : "";
    return `<button class="opt" type="button" data-addb="${esc(b.id)}" ${why ? 'aria-disabled="true"' : ""}><span><b>${esc(b.name)}</b> <span class="meta">v${b.version} · tested at ${fd(b.dose ?? 1)}</span></span><span class="meta">${why || "behavior"}</span></button>`; }).join("");
  openPop(anchor, `<button class="opt" type="button" data-addn><span><b>Push a neuron</b></span><span class="meta">layer, neuron, dose</span></button>${beh || `<button class="opt" type="button" data-addnew><span><b>New behavior</b></span><span class="meta">Create from a family</span></button>`}`);
  pop.addEventListener("click", (e) => {
    const t = e.target.closest(".opt"); if (!t || t.getAttribute("aria-disabled") === "true") return;
    if (t.hasAttribute("data-addn")) rowForm(anchor); else if (t.hasAttribute("data-addnew")) { closePop(); openPage({ kind: "new" }); } else { closePop(); useBehavior(t.dataset.addb); }
  });
}
let pop = null;
function closePop() { pop?.remove(); pop = null; }
function openPop(anchor, html) {
  closePop(); pop = document.createElement("div"); pop.className = "pop"; pop.innerHTML = html;
  const r = anchor.getBoundingClientRect(); pop.style.left = Math.max(8, Math.min(innerWidth - 340, r.left + scrollX)) + "px"; pop.style.top = r.bottom + scrollY + 6 + "px";
  document.body.append(pop); pop.querySelector("input, .opt")?.focus();
}
document.addEventListener("click", (e) => { if (pop && !pop.contains(e.target) && !e.target.closest("#addBtn,[data-focus]")) closePop(); });
// One form adds or edits a neuron row; it validates against the active model's limits.
function rowForm(anchor, i) {
  const r = i == null ? { layer: S.rows.at(-1)?.layer ?? 0, neuron: 0, dose: 1 } : S.rows[i], L = S.limits;
  openPop(anchor, `<form id="rowForm" novalidate><span class="label">${i == null ? "Push a neuron" : `Edit ${nid(r)}`}</span>
    <div class="grid3"><label><span class="meta">layer 0-${L.layers - 1}</span><input class="num" name="layer" inputmode="numeric" value="${r.layer}"></label>
    <label><span class="meta">neuron 0-${L.neurons - 1}</span><input class="num" name="neuron" inputmode="numeric" value="${r.neuron}"></label>
    <label><span class="meta">dose</span><input class="num" name="dose" inputmode="decimal" value="${fd(r.dose)}"></label></div>
    <p class="err" id="rowErr" role="alert"></p>
    <div class="row2"><button class="btn btn-sm" type="submit">${i == null ? "Add" : "Save"}</button><button class="btn btn-sm" type="button" id="rowCancel">Cancel</button></div></form>`);
  $("rowCancel").addEventListener("click", closePop);
  $("rowForm").addEventListener("submit", (e) => {
    e.preventDefault(); const f = e.target, v = { layer: Number(f.layer.value), neuron: Number(f.neuron.value), dose: parseDose(f.dose.value) };
    const bad = !Number.isInteger(v.layer) || v.layer < 0 || v.layer >= L.layers ? ["layer", `Layer must be 0 to ${L.layers - 1}.`]
      : !Number.isInteger(v.neuron) || v.neuron < 0 || v.neuron >= L.neurons ? ["neuron", `Neuron must be 0 to ${L.neurons - 1}.`]
      : Number.isNaN(v.dose) || v.dose < L.dose_min || v.dose > L.dose_max ? ["dose", `Dose must be ${L.dose_min} to +${L.dose_max}.`] : null;
    f.querySelectorAll(".num").forEach((x) => x.removeAttribute("aria-invalid"));
    if (bad) { f[bad[0]].setAttribute("aria-invalid", "true"); $("rowErr").textContent = bad[1]; f[bad[0]].focus(); return; }
    const dup = S.rows.findIndex((x, j) => j !== i && nid(x) === nid(v));
    if (dup >= 0) { $("rowErr").textContent = `${nid(v)} is already in the edits.`; return; }
    if (i == null) S.rows.push(v); else S.rows[i] = v;
    S.focusEdit = i == null ? S.rows.length - 1 : i; closePop(); update();
  });
}
$("sentence").addEventListener("click", (e) => {
  const t = e.target;
  if (t.closest("#addBtn")) addMenu(t.closest("#addBtn"));
  else if (t.closest("[data-remove]")) { S.rows.splice(+t.closest("[data-remove]").dataset.remove, 1); S.focusEdit = Math.max(0, Math.min(S.focusEdit, S.rows.length - 1)); update(); }
  else if (t.closest("[data-focus]")) { const i = +t.closest("[data-focus]").dataset.focus; if (i === S.focusEdit && !S.running) { if (!isB(S.rows[i])) rowForm(t.closest("[data-focus]"), i); } else { S.focusEdit = i; update(); } }
});
$("prompt").addEventListener("input", () => { S.sel = null; renderShelf(); renderTree(); });

/* ---------- tree ---------- */
function treeRuns() {
  const e = curExp(); if (!e) return null;
  const runs = [{ n: 1, rows: [], text: e.baseline.text, split: null }, ...e.runs];
  const cs = runs.filter((r) => r.split).map((r) => r.split.char);
  let c = cs.length ? Math.min(...cs) : (/^\S+\s+\S+\s*/.exec(e.baseline.text) || [""])[0].length;
  // A split offset can point at the space before a word (BPE tokens carry it): step onto the word, then back to its start.
  while (c < e.baseline.text.length && /\s/.test(e.baseline.text[c])) c++;
  while (c > 0 && !/\s/.test(e.baseline.text[c - 1])) c--;
  runs.forEach((r) => {
    const out = [], re = /\S+\s*/g, tail = r.text.slice(c); let m;
    const sc = r.split ? r.split.char + /^\s*/.exec(r.text.slice(r.split.char))[0].length : -1;
    while ((m = re.exec(tail))) { const start = c + m.index, core = m[0].trimEnd(); out.push({ w: core, sp: m[0].slice(core.length), split: sc >= start && sc < start + core.length }); }
    r.words = out; r.score = r.rows.reduce((a, x) => a + x.dose, 0);
  });
  return { e, runs, rootChar: c, shared: e.baseline.text.slice(0, c).trim() };
}
const matching = (T) => T && T.runs.find((r) => rowsKey(r.rows) === rowsKey(S.rows));
let expanded = new Set();
function runHtml(r, current, inspect) {
  if (r.live) {
    // A column of a running filmstrip: real streamed text, not clickable until it completes.
    const text = r.words.map((x) => x.w + x.sp).join("");
    return `<div class="run generating" data-n="${r.n}" aria-current="false"><div class="k"><span class="pick">running: ${esc(editsText(r.rows))}</span><span class="state info">RUNNING</span></div><div class="t">${text ? esc(text) : Array.from({ length: 5 }, (_, i) => `<span class="redact" style="width:${2.4 + (i * 3 % 5) * .7}em"></span>`).join("")}</div></div>`;
  }
  const full = expanded.has(r.n), n = full ? Infinity : current ? 26 : 16;
  const body = r.words ? r.words.slice(0, n).map((x, j) => `<span class="w${x.split ? " split" : ""}${inspect && inspect.run === r.n && inspect.i === j ? " inspected" : ""}" data-run="${r.n}" data-i="${j}" tabindex="0" role="button" aria-label="Inspect “${esc(x.w)}”">${esc(x.w)}</span>${x.sp}`).join("") + (r.words.length > n ? `… <button class="more" type="button" data-more="${r.n}">show all</button>` : "")
    : Array.from({ length: 7 }, (_, i) => `<span class="redact" style="width:${2.4 + (i * 3 % 5) * .7}em"></span>`).join("") + `<span class="meta"> ${S.running ? "generating" : "not run yet"}</span>`;
  const edits = editsText(r.rows) + (r.research ? ", research mode" : "");
  const label = r.n ? `run ${r.n}: ${edits}` : `next: ${edits}`;
  const tag = !r.n ? `<span class="state ${S.running ? "info" : "warn"}">${S.running ? "RUNNING" : "NOT RUN"}</span>` : r.n > 1 && !r.split ? '<span class="state warn">NO SPLIT</span>' : "";
  return `<div class="run${!r.n && S.running ? " generating" : ""}" data-n="${r.n}" aria-current="${current}"><div class="k"><button class="pick" type="button" data-pick="${r.n}" ${!r.n || S.running ? "disabled" : ""}>${label}</button>${current ? '<span class="state info">SELECTED</span>' : ""}${tag}</div><div class="t">${body}</div></div>`;
}
let drawN = null;
function renderTree() {
  const T = treeRuns(), m = matching(T);
  S.sel = m ? m.n : 0;
  const list = T ? [...T.runs] : [];
  if (S.live) S.live.cols.forEach((c, i) => {
    if (c.dose === 0 && T) return;
    const text = c.pieces.join(""), from = T ? Math.min(T.rootChar, text.length) : 0, out = [], re = /\S+\s*/g; let mm;
    while ((mm = re.exec(text.slice(from)))) { const core = mm[0].trimEnd(); out.push({ w: core, sp: mm[0].slice(core.length) }); }
    list.push({ n: -(i + 1), live: true, rows: c.dose === 0 ? [] : [{ trait: S.live.trait, dose: c.dose }], words: out, score: c.dose });
  });
  else if (!m && (T || S.running)) list.push({ n: 0, rows: S.rows, words: null, score: -1e9 });
  if (!T && !S.running) {
    $("root").innerHTML = ""; $("runs").innerHTML = `<p class="empty tree-empty">${S.api ? "No runs for this prompt yet. Set the edits in the sentence, then press Run. The baseline and your edited answer appear here, and every later run adds a branch." : "The lobot server is not reachable. Start it with: uv run python server.py"}</p>`;
    $("links").innerHTML = ""; $("shareBtn").disabled = true; $("plan").textContent = ""; return;

    el.innerHTML = top("New behavior") + `<p class="lead">Create builds a behavior on <span class="mono">${esc(short(S.model))}</span> from a validated family: contrast prompts, a direction, a layer and dose, a held-out final check, and a report card. Only families with a hand-validated judge can pass.</p>

      <ol class="ruled">${S.families.map((f) => { const ok = f.hand_validated, v = f.validation || {};
        return `<li class="${ok ? "" : "off"}"><div><b class="name">${esc(f.name)}</b>${f.aliases?.length ? ` <span class="meta">also ${esc(f.aliases.join(", "))}</span>` : ""}<br>
          <span class="meta">${ok ? `judge asks: “${esc(f.judge)}” · agreement ${v.agreement != null ? v.agreement.toFixed(2) : "n/a"} on ${v.hand_labels ?? "?"} hand labels` : "not supported yet: its judge has no hand-validated labels"}</span></div>
          <button class="btn" type="button" data-create="${esc(f.name)}" ${!ok || job ? "disabled" : ""}>Create</button></li>`; }).join("")}</ol><p class="err meta" id="newErr" role="alert" style="color:var(--error)"></p>`;
  } else if (p.kind === "create") {
    let j = S.jobs.find((x) => x.id === p.id);
    if (!j || active(j)) { try { j = await getJSON(`api/create/${encodeURIComponent(p.id)}`); const i = S.jobs.findIndex((x) => x.id === j.id); if (i >= 0) S.jobs[i] = j; else S.jobs.push(j); } catch { if (!j) { el.innerHTML = top("Create") + `<p class="empty">This Create job is not on the server.</p>`; return; } } }
    const si = STAGES.findIndex(([k]) => k === j.stage), live = active(j), doneAll = j.status === "done";
    const el2 = ((live ? Date.now() / 1000 : j.updated) - j.created);
    const head = live ? `Creating ${esc(j.trait)}` : `${esc(j.trait)}: ${doneAll ? "done" : j.status}`;
    const rows = STAGES.map(([k, label], i) => { const st = doneAll || i < si ? "done" : i === si && live ? "now" : "wait", pr = j.progress || {};
      return `<li class="${st === "done" ? "done" : st === "wait" ? "wait" : ""}" ${st === "now" ? 'aria-current="step"' : ""}><span class="no">${i + 1}</span><div><b>${label}</b><br><span class="meta">${st === "now" ? `${pr.done ?? 0} of ${pr.total ?? "?"} units` : st === "done" ? "done" : i === si && !live ? `${j.status} here` : "waiting"}</span></div>
        <span class="state ${st === "done" ? "ok" : st === "now" ? "info" : "info"}">${st === "done" ? "DONE" : st === "now" ? "NOW" : i === si && !live ? j.status.toUpperCase() : "WAITING"}</span></li>`; }).join("");
    const verdict = !doneAll ? "" : j.verdict === "knob" ? `<p><span class="state ok">KNOB</span> A layer and dose passed the gates: layer <span class="mono">${j.frozen?.layer}</span>, dose <span class="mono">${fd(j.frozen?.dose ?? 0)}</span>.</p><div class="row2"><button class="btn" type="button" data-beh="${esc(j.id)}">Open evidence</button><button class="btn" type="button" data-use="${esc(j.id)}">Use in the sentence</button></div>`
      : j.verdict === "blocked" ? `<p><span class="state err">GUARD</span> The refusal guard blocked the frozen direction. It cannot be used.</p>` : `<p><span class="state warn">NO KNOB</span> No layer and dose passed the gates. Nothing was saved as a knob.</p><button class="btn" type="button" data-beh="${esc(j.id)}">Open evidence</button>`;
    el.innerHTML = top(head) + `<p class="meta"><span class="mono">${esc(short(j.model_id))}</span>, seed ${j.seed}, ${live ? "elapsed" : "took"} <span class="mono">${mins(Math.max(0, el2))}</span>${j.research_mode ? ", research mode" : ""}</p>
      <ol class="ruled stages" aria-label="Create stages">${rows}</ol>
      ${live ? `<div class="row2"><button class="btn" type="button" id="stopCreate">Stop Create</button><span class="meta">${si >= 3 ? "Stopping now uses up this version's final check." : "Stopping before the final check costs nothing."}</span></div><p class="meta">The server keeps working if you close this page. The page reattaches when you open it again.</p>` : ""}
      ${j.status === "failed" ? `<p class="empty" style="color:var(--error)">Create failed: ${esc((j.error || "").split("\n").filter(Boolean).pop() || "no reason given")}</p>` : ""}${verdict}`;
  } else if (p.kind === "behavior") {
    const b = behaviors().all.find((x) => x.id === p.id), j = S.jobs.find((x) => x.id === p.id), name = b ? b.name : j ? j.trait : "Behavior";
    if (!(p.id in reports)) { el.innerHTML = top(esc(name)) + `<p class="meta">Loading the evidence.</p>`; try { reports[p.id] = await getJSON(`api/traits/${encodeURIComponent(p.id)}/report`); } catch (e) { reports[p.id] = { missing: e.status || e.message }; } if (S.page !== p) return; }
    if (!S.families) S.families = await getJSON("api/families").then((x) => x.families).catch(() => []);
    const R = reports[p.id], fam = (S.families || []).find((f) => f.name === name), fr = R.frozen || (b && { layer: b.layer, dose: b.dose }) || {};
    const actions = `<div class="row2">${b && b.usable ? `<button class="btn" type="button" data-use="${esc(b.id)}">Use in the sentence</button>` : ""}${b && b.patch ? `<a class="btn" href="${esc(b.patch)}" download>Download patch</a>` : `<button class="btn" type="button" disabled>Download patch</button><span class="meta">${b && b.verdict === "knob" ? "Patch download needs the evidence API." : "Only a passing knob has a patch."}</span>`}</div>`;
    let body;
    if (R.missing) body = `<p class="empty">The evidence needs the evidence API (E1), which this server does not have yet. Verdict from the Create job: ${esc(b ? b.key : j?.verdict || "unknown")}.</p>`;
    else {
      const F = R.final || {}, el_ = R.eligibility || {}, d = fr.dose;
      const verb = (label, k, card, eligible, doses) => { const c = card || null, fails = c && !c.passed ? Object.entries(c.rules || {}).filter(([, v]) => !v).map(([r]) => RULES[r] || r) : [];
        return `<tr><td class="verb">${stroke(k === "delete" ? "delete" : "update")}${label}</td><td>${c ? `<span class="state ${c.passed ? "ok" : "warn"}">${c.passed ? "PASS" : "FAIL"}</span>${fails.length ? `<br><span class="meta">${esc(fails.join("; "))}</span>` : ""}${c.passed && !eligible ? `<br><span class="meta">not offered: read check failed</span>` : ""}` : `<span class="state info">NOT TESTED</span>`}</td>
          <td class="mono">${c ? `${num(c.trait_mean)} ${ci(c.trait_ci)}` : ""}</td><td class="mono">${c ? `under ${num(c.control_ci?.[1])}` : ""}</td><td class="meta">not measured yet</td><td class="mono">${doses}</td></tr>`; };
      const rg = R.read_gate;
      body = `<p class="meta">Held-out evaluation · ${esc(name)} v${b ? b.version : "?"} · layer <span class="mono">${fr.layer ?? "?"}</span> · dose <span class="mono">${d != null ? fd(d) : "?"}</span>. Effects are judge-score gains on held-out prompts, with 95% bootstrap intervals.</p>
        <div class="evwrap"><table class="ev"><thead><tr><th scope="col">Verb</th><th scope="col">Result</th><th scope="col">Effect (95% CI)</th><th scope="col">Control bound</th><th scope="col">Side effects</th><th scope="col">Tested doses</th></tr></thead><tbody>
        <tr><td class="verb">${stroke("read")}Read</td><td>${rg ? `<span class="state ${rg.pass ? "ok" : "warn"}">${rg.pass ? "PASS" : "FAIL"}</span>${rg.pass ? "" : `<br><span class="meta">the reading does not track the judge (margin under 0.10)</span>`}` : `<span class="state info">NOT TESTED</span>`}</td><td class="mono">${rg ? `margin ${num(rg.agreement?.margin)}` : ""}</td><td></td><td class="meta">none (reading only)</td><td class="mono">none</td></tr>
        ${verb("Increase", "up", F.update_up?.card, el_.update_up, d != null ? fd(d) : "")}${verb("Decrease", "down", F.update_down?.card, el_.update_down, d != null ? fd(-d) : "")}${verb("Delete", "delete", F.delete?.card, el_.delete, "ablation")}
        </tbody></table></div>
        <div class="kv2"><span>Prompt only</span><span>${R.prompt_baseline?.card ? `<span class="mono">${num(R.prompt_baseline.card.trait_mean)} ${ci(R.prompt_baseline.card.trait_ci)}</span> with the instruction “${esc(R.prompt_baseline.top || "")}”` : "not measured"}</span>
          <span>Refusal guard</span><span>${R.guard ? `${R.guard.blocked ? '<span class="state err">BLOCKED</span>' : '<span class="state ok">PASSED</span>'} refusal kept at <span class="mono">${R.guard.min_ratio != null ? Math.round(R.guard.min_ratio * 100) + "%" : "n/a"}</span> of its usual level${R.guard.verified ? ", confirmed by full generation" : ", first-token check only"}${R.guard.research_mode ? ", research mode" : ""}` : "not recorded"}</span>
          <span>Judge</span><span>${fam ? `“${esc(fam.judge)}” · agreement <span class="mono">${fam.validation?.agreement?.toFixed(2) ?? "n/a"}</span> on ${fam.validation?.hand_labels ?? "?"} hand labels` : "unknown"}</span>
          <span>Model fingerprint</span><span class="mono">${esc(R.fingerprint || "not recorded")}</span>
          <span>Create time</span><span class="mono">${R.seconds ? mins(R.seconds) : "n/a"}</span></div>`;
    }
    el.innerHTML = top(esc(name) + (b ? ` <span class="meta">v${b.version}</span>` : "")) + (b ? `<p><span class="state ${b.kind}">${b.key}</span> <span class="meta"><span class="mono">${esc(short(S.model))}</span>${b.created ? `, created ${new Date(b.created * 1000).toLocaleDateString()}` : ""}</span></p>` : "") + actions + body;
  }
  if (first) $("pageH")?.focus(); else if (keep && $(keep)) $(keep).focus();
}
$("vPage").addEventListener("click", async (e) => {
  const t = e.target;
  if (t.closest("[data-back]")) { S.page = null; setView("work"); update(); }
  else if (t.closest("[data-use]")) useBehavior(t.closest("[data-use]").dataset.use);
  else if (t.closest("[data-beh]")) openPage({ kind: "behavior", id: t.closest("[data-beh]").dataset.beh });
  else if (t.closest("[data-create]")) {
    const b = t.closest("[data-create]"); b.disabled = true;
    try {
      const r = await postJSON("api/create", { description: b.dataset.create, guard: !S.research, research_mode: S.research }), body = await r.json();
      if (!r.ok) throw new Error(typeof body.detail === "string" ? body.detail : `HTTP ${r.status}`);
      S.jobs.push(body); openPage({ kind: "create", id: body.job_id }); update();
    } catch (err) { b.disabled = false; $("newErr").textContent = `Create did not start: ${err.message}`; }
  } else if (t.closest("#stopCreate")) {
    const j = S.jobs.find((x) => x.id === S.page.id), late = j && STAGES.findIndex(([k]) => k === j.stage) >= 3;
    if (late && !(await confirmDlg("Stop during the final check?", "The final check uses this version's held-out prompts once. If you stop now, they count as used, and this version cannot be checked again.", "Stop Create"))) return;
    try { const r = await postJSON(`api/create/${encodeURIComponent(S.page.id)}/stop`, {}); if (r.ok) Object.assign(j, await r.json()); } catch { /* the next poll shows the state */ }
    renderPage();
  }
});
async function loadBehaviors() {
  if (!S.api) return;
  try { S.jobs = (await getJSON("api/jobs")).jobs; } catch { S.jobs = []; }
  try { S.traits = (await getJSON(`api/traits?model_id=${encodeURIComponent(S.model)}`)).traits; } catch { S.traits = null; }
}
// Poll every 2 s while a Create runs; the server keeps working when the page is closed, so this also reattaches.
setInterval(async () => {
  if (!S.api || !(S.jobs.some(active) || S.page?.kind === "create")) return;
  const was = S.jobs.filter(active).map((j) => j.id).join();
  await loadBehaviors();
  if (S.jobs.filter(active).map((j) => j.id).join() !== was && !S.running) update(); else { renderShelf(); renderGuard(); }
  if (S.page?.kind === "create") renderPage();
}, 2000);

/* ---------- share card ---------- */
function renderCard() {
  const T = treeRuns(); if (!T) return;
  const pick = T.runs.find((r) => r.n === S.sel && r.split) || T.runs.filter((r) => r.split).sort((a, b) => b.at - a.at)[0];
  const words = (r, from, n) => r.words.slice(from, from + n).map((x) => x.w + x.sp).join("").trim();
  const si = Math.max(0, pick.words.findIndex((x) => x.split)), model = T.e.model.split("/").pop();
  const base = words(T.runs[0], 0, 9), lead = words(pick, 0, si), splitW = pick.words[si]?.w || "", tail = words(pick, si + 1, 9);
  const edits = editsText(pick.rows);
  $("card").innerHTML = `<div class="ct"><span class="wordmark">lobot</span><span class="meta">${esc(model)}</span></div>
    <p class="meta" style="margin:14px 0 0;font-family:var(--body);font-size:14px">“${esc(T.e.prompt)}”</p>
    <div class="cf" id="cf"><svg id="cfl" aria-hidden="true"></svg><div style="font:400 34px var(--body)" id="cr">${esc(T.shared)}</div>
      <div class="cb"><div id="cb0"><span class="meta" style="display:block">no edit</span>${esc(base)}…</div><div id="cb1"><span class="meta" style="display:block">${pick.rows.some(isB) ? `${esc(pick.rows[0].trait)} pushed` : `${pick.rows.length} neuron${pick.rows.length === 1 ? "" : "s"} pushed`}</span>${lead ? esc(lead) + " " : ""}<span class="tok">${esc(splitW)}</span> ${esc(tail)}…</div></div></div>
    <div><span class="mono" style="font-size:15px;color:var(--ink)">${esc(edits)}</span><br><span class="meta">same prompt, same seed, split at ${at(pick.split)}${pick.research ? " · research mode, guard off" : ""}</span></div>`;
  $("post").textContent = pick.post || ""; $("postCount").textContent = pick.post ? `${[...pick.post].length}/280` : "";
  $("recipe").textContent = pick.recipe || "";
  requestAnimationFrame(() => {
    const box = $("cf").getBoundingClientRect(), rb = $("cr").getBoundingClientRect(), cs = getComputedStyle(root), x0 = rb.right - box.left + 6, y0 = rb.top - box.top + rb.height / 2;
    $("cfl").innerHTML = [["cb0", cs.getPropertyValue("--ink"), 2], ["cb1", cs.getPropertyValue("--cut"), 4]].map(([id, c, w]) => { const b = $(id).getBoundingClientRect(), x1 = b.left - box.left - 6, y1 = b.top - box.top + b.height / 2; return `<path d="M${x0} ${y0} C ${(x0 + x1) / 2} ${y0}, ${(x0 + x1) / 2} ${y1}, ${x1} ${y1}" fill="none" stroke="${c}" stroke-width="${w}"/>`; }).join("");
  });
}
function setView(v) {
  S.view = v; closePop(); $("vWork").hidden = v !== "work"; $("vShare").hidden = v !== "share"; $("vPage").hidden = v !== "page";
  if (v !== "page") S.page = null;
  if (v === "page") return;
  if (v === "share") { renderCard(); $("shareH").setAttribute("tabindex", "-1"); $("shareH").focus(); } else { requestAnimationFrame(layout); $("shareBtn").focus(); }
}
$("shareBtn").addEventListener("click", () => setView("share"));
$("backBtn").addEventListener("click", () => setView("work"));
document.querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", async () => {
  const text = $(b.dataset.copy).textContent, label = b.textContent;
  try { await navigator.clipboard.writeText(text); b.textContent = "Copied"; }
  catch { const r = document.createRange(); r.selectNodeContents($(b.dataset.copy)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected: press ⌘C"; }
  setTimeout(() => (b.textContent = label), 1600);
}));

/* ---------- boot ---------- */
function applyState(st) {
  S.state = st; S.model = st.active_model;
  S.limits = { layers: st.layers, neurons: st.neurons, dose_min: st.dose_min, dose_max: st.dose_max, max_rows: st.max_rows };
  K.draw();
}
function update() { renderShelf(); renderSentence(); renderTree(); renderKnob(); renderGuard(); }
// Seed the browser's experiments with every recording (example.json, sweep*.json) once per file version,
// so the tree is not empty on first visit and a newly recorded sweep shows up.
async function seedRecorded() {
  const seen = new Set(store.get("seededFiles", []));
  const names = ["example.json", "sweep.json", ...(S.state ? S.state.models.map((m) => `sweep.${m.short}.json`) : [])];
  for (const name of names) {
    const text = await fetch(name).then((r) => (r.ok ? r.text() : null)).catch(() => null);
    const tag = text && `${name}:${text.length}`;
    if (!text || seen.has(tag)) continue;
    const d = JSON.parse(text);
    if (d.runs) for (const r of d.runs) addResult({ model_id: d.model_id, prompt: d.prompt, rows: r.rows, baseline: d.baseline, steered: { text: r.text, tokens: r.tokens }, split: r.split, seconds: r.seconds, recipe: r.recipe || "", post: r.post || "" });
    else addResult({ ...d });
    seen.add(tag);
  }
  store.set("seededFiles", [...seen]);
}
await document.fonts.ready;
K.draw();
try {
  const r = await fetch("api/state"); if (!r.ok) throw new Error();
  applyState(await r.json()); S.api = true;
  await loadBehaviors();
} catch { S.api = false; }
await seedRecorded();
const last = Object.values(EXPS).filter((e) => !S.model || e.model === S.model).sort((a, b) => b.at - a.at)[0];
if (!S.model) S.model = last ? last.model : "Qwen/Qwen3.5-4B";
$("prompt").value = last ? last.prompt : "";
const lastRun = last && last.runs.filter((x) => x.split).sort((a, b) => b.at - a.at)[0];
S.rows = lastRun ? lastRun.rows.map((x) => ({ ...x })) : (S.state ? S.state.preset_rows.map((x) => ({ ...x })) : []);
update();
if (!S.api) setStatus("err", "OFFLINE", "The lobot server is not reachable. The tree shows saved runs. Start the server with: uv run python server.py");
else if (S.state.replay) setStatus("info", "REPLAY", "Replay mode: no weights are loaded. Run answers only setups that were recorded.");
else if (S.state.no_model) setStatus("warn", "NO WEIGHTS", "The server runs without weights (MODEL_LOBOTOMY_NO_MODEL). Runs return an error.");
</script>
